<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveTubeNow - Admin Register</title>
    <!-- Tailwind CSS v4 Dev CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Plus Jakarta Sans Font linkage to perfectly align typography across pages -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Premium Dark UI Container Card -->
    <div class="bg-slate-900/60 backdrop-blur-xl p-8 rounded-2xl shadow-2xl border border-slate-800/80 w-full max-w-md">
        
        <!-- Unified Brand Identity Header -->
        <div class="text-center mb-6">
            <span class="text-2xl font-black text-indigo-500 tracking-tight">SaveTube<span class="text-white">Now</span></span>
            <h2 class="text-xl font-bold text-slate-100 mt-3">Create Admin Account</h2>
            <p class="text-slate-400 text-sm mt-1">Setup master system configurations.</p>
        </div>
        
        <!-- Administrative Registration Form -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                <input type="text" id="username" required class="w-full px-4 py-2.5 rounded-xl bg-slate-950/50 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-100 placeholder-slate-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2.5 rounded-xl bg-slate-950/50 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-100 placeholder-slate-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-xl bg-slate-950/50 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-100 placeholder-slate-600">
            </div>
            
            <!-- Dark Theme Refined Security Notification Banner -->
            <div class="bg-amber-500/10 border border-amber-500/20 p-3.5 rounded-xl text-xs text-amber-400 flex items-start gap-2.5 shadow-inner">
                <span class="mt-0.5">⚠️</span>
                <span class="leading-relaxed"><strong>Security Lockout Action Active:</strong> This initialization path is single-use only. Once an admin profile is written to the table, this form becomes non-functional.</span>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 shadow-md cursor-pointer mt-2 active:scale-[0.99]">
                Register Admin
            </button>
        </form>
        
        <!-- Redirect Context Link -->
        <p class="text-center text-sm text-slate-400 mt-5">
            Already setup? <a href="/login.html" class="text-indigo-400 hover:text-indigo-300 hover:underline font-medium transition-colors">Sign In</a>
        </p>
    </div>

    <!-- Initialization Execution Form Processing Script -->
    <script>
        // ⚡ Premium Toast Alert Notification Engine
        function triggerAlert(message, type = 'info') {
            // Ensure container wrapper exists on the body canvas
            let container = document.getElementById('system-toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'system-toast-container';
                container.className = 'fixed top-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0';
                document.body.appendChild(container);
            }

            // Generate configuration metrics based on type parameters
            let themeClasses = 'border-slate-800 bg-slate-900/95 text-slate-200';
            let iconSymbol = '⚙️';
            
            if (type === 'success') {
                themeClasses = 'border-emerald-500/20 bg-emerald-950/90 text-emerald-400 shadow-xl';
                iconSymbol = '⚡';
            } else if (type === 'error') {
                themeClasses = 'border-rose-500/20 bg-rose-950/90 text-rose-400 shadow-xl';
                iconSymbol = '🚨';
            }

            // Assemble dynamic component markup
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl border backdrop-blur-md flex items-start gap-3 pointer-events-auto transition-all duration-300 transform translate-x-12 opacity-0 ${themeClasses}`;
            toast.innerHTML = `
                <span class="text-sm select-none mt-0.5">${iconSymbol}</span>
                <div class="flex-1 text-xs font-semibold leading-relaxed tracking-wide">${message}</div>
            `;

            container.appendChild(toast);

            // Trigger execution entrance animation framework 
            setTimeout(() => {
                toast.classList.remove('translate-x-12', 'opacity-0');
            }, 10);

            // Fire exit destruction sequence after timeline window expiration
            setTimeout(() => {
                toast.classList.add('translate-x-12', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // 🎛️ Form Submission Processing Pipeline
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const response = await fetch('/api/admin/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    triggerAlert(data.message || 'Master Admin profile generated successfully. Routing to portal...', 'success');
                    // 1.5s delay allows the user to see and process the success toast message before navigation happens
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    triggerAlert(data.error || 'System initialization failure occurred.', 'error');
                }
            } catch (err) {
                triggerAlert('Network error. Unable to link to system creation gateway.', 'error');
            }
        });
    </script>
</body>
</html>
