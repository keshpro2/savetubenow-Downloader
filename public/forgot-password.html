<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveTubeNow - Reset Password</title>
    <!-- Tailwind CSS v4 Dev CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Plus Jakarta Sans Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Premium Dark UI Container Card -->
    <div class="bg-slate-900/60 backdrop-blur-xl p-8 rounded-2xl shadow-2xl border border-slate-800/80 w-full max-w-md">
        
        <!-- Unified Brand Identity Header -->
        <div class="text-center mb-6">
            <span class="text-2xl font-black text-indigo-500 tracking-tight">SaveTube<span class="text-white">Now</span></span>
            <h2 class="text-xl font-bold text-slate-100 mt-3">Account Recovery</h2>
            <p class="text-slate-400 text-sm mt-1">Recover your platform authentication credentials.</p>
        </div>
        
        <!-- STEP 1: REQUEST CODE FROM EMAIL -->
        <form id="requestCodeForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Your Administrator Email</label>
                <input type="email" id="reqEmail" required placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-xl bg-slate-950/50 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-100 placeholder-slate-600 disabled:opacity-50 disabled:cursor-not-allowed">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-50 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 shadow-md cursor-pointer mt-2 active:scale-[0.99]">
                Send Recovery Code
            </button>
        </form>

        <!-- STEP 2: VERIFY AND UPDATE FORM (HIDDEN BY DEFAULT UNTIL CODE DROPS) -->
        <form id="resetPasswordForm" class="space-y-4 hidden mt-6 pt-6 border-t border-slate-800/80">
            <div class="text-center mb-3">
                <span class="inline-block bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider shadow-xs">
                    Verification Code Sent
                </span>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">6-Digit Pin Code</label>
                <input type="text" id="resetCode" maxlength="6" required class="w-full px-4 py-2.5 rounded-xl bg-slate-950/50 border text-center font-mono text-2xl tracking-widest border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-100 placeholder-slate-700">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">New Secure Password</label>
                <input type="password" id="newPassword" required class="w-full px-4 py-2.5 rounded-xl bg-slate-950/50 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-100 placeholder-slate-600">
            </div>
            <button type="submit" class="w-full bg-slate-100 hover:bg-white text-slate-950 font-semibold py-2.5 px-4 rounded-xl transition duration-200 shadow-md cursor-pointer mt-2 active:scale-[0.99]">
                Update Password
            </button>
        </form>
        
        <!-- Redirect Context Link -->
        <p class="text-center text-sm text-slate-400 mt-5">
            Remember password? <a href="/login.html" class="text-indigo-400 hover:text-indigo-300 hover:underline font-medium transition-colors">Return to Login</a>
        </p>
    </div>

    <!-- Script execution paths completely unmodified to ensure functionality integrity -->
    <script>
        let localizedEmailTarget = "";

        document.getElementById('requestCodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            localizedEmailTarget = document.getElementById('reqEmail').value;
            
            const response = await fetch('/api/admin/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: localizedEmailTarget })
            });
            const data = await response.json();
            alert(data.message || data.error);
            
            if(data.success) {
                // Keep field disabled to prevent multi-hit race conditions
                document.getElementById('reqEmail').disabled = true;
                document.getElementById('resetPasswordForm').classList.remove('hidden');
            }
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/admin/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: localizedEmailTarget,
                    resetCode: document.getElementById('resetCode').value,
                    newPassword: document.getElementById('newPassword').value
                })
            });
            const data = await response.json();
            alert(data.message || data.error);
            if(data.success) window.location.href = '/login.html';
        });
    </script>
</body>
</html>
